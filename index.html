<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ローカル PDF ツール</title>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 650px;
      margin: 40px auto;
      padding: 0 16px;
      color: #333;
      background: #f8fafc;
    }
    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }
    h1 { font-size: 1.4rem; margin: 0 0 6px; }
    .desc { font-size: 0.85rem; color: #64748b; margin: 0 0 20px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }
    .tab-btn {
      background: none;
      border: none;
      padding: 8px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      border-radius: 6px;
    }
    .tab-btn.active { background: #eff6ff; color: #2563eb; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .upload-area {
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      background: #f8fafc;
      margin-bottom: 16px;
    }
    input[type="file"] { margin: 8px 0; }
    button.action-btn {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.action-btn:hover { background: #1d4ed8; }
    button.action-btn:disabled { background: #cbd5e1; cursor: not-allowed; }
    .msg { margin-top: 14px; font-size: 0.9rem; font-weight: 500; text-align: center; min-height: 1.2em; }
    .note { font-size: 0.8rem; color: #94a3b8; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔒 安全な PDF ツール</h1>
    <p class="desc">外部送信ゼロ。ファイルはお使いの端末内でのみ処理されます。</p>

    <!-- タブメニュー -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('merge')">📎 結合</button>
      <button class="tab-btn" onclick="switchTab('split')">✂️ 分割</button>
      <button class="tab-btn" onclick="switchTab('rotate')">🔄 回転</button>
    </div>

    <!-- 1. 結合 -->
    <div id="tab-merge" class="tab-content active">
      <div class="upload-area">
        <label><b>結合したいPDFを2つ以上選択</b><br>
          <input type="file" id="mergeFiles" multiple accept="application/pdf">
        </label>
      </div>
      <button class="action-btn" id="mergeBtn" disabled>PDF を結合して保存</button>
      <div class="msg" id="mergeMsg"></div>
    </div>

    <!-- 2. 分割 -->
    <div id="tab-split" class="tab-content">
      <div class="upload-area">
        <label><b>1ページずつバラバラにしたいPDFを選択</b><br>
          <input type="file" id="splitFile" accept="application/pdf">
        </label>
      </div>
      <button class="action-btn" id="splitBtn" disabled>全ページをバラして保存</button>
      <div class="note">※ブラウザから「複数ファイルのダウンロード許可」を求められた場合は許可してください。</div>
      <div class="msg" id="splitMsg"></div>
    </div>

    <!-- 3. 回転 -->
    <div id="tab-rotate" class="tab-content">
      <div class="upload-area">
        <label><b>向きを変えたいPDFを選択</b><br>
          <input type="file" id="rotateFile" accept="application/pdf">
        </label>
      </div>
      <button class="action-btn" id="rotateBtn" disabled>右に 90° 回転して保存</button>
      <div class="msg" id="rotateMsg"></div>
    </div>
  </div>

  <script>
    // タブ切り替え処理
    function switchTab(type) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('tab-' + type).classList.add('active');
    }

    // ダウンロード用ヘルパー関数
    function downloadBlob(bytes, filename) {
      const blob = new Blob([bytes], { type: 'application/pdf' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // --- 1. 結合機能 ---
    const mergeInput = document.getElementById('mergeFiles');
    const mergeBtn = document.getElementById('mergeBtn');
    const mergeMsg = document.getElementById('mergeMsg');

    mergeInput.addEventListener('change', () => {
      mergeBtn.disabled = mergeInput.files.length < 2;
      mergeMsg.textContent = mergeInput.files.length > 0 ? `${mergeInput.files.length} 個選択中` : '';
    });

    mergeBtn.addEventListener('click', async () => {
      mergeMsg.textContent = '結合処理中...';
      try {
        const mergedPdf = await PDFLib.PDFDocument.create();
        for (const file of mergeInput.files) {
          const buffer = await file.arrayBuffer();
          const pdf = await PDFLib.PDFDocument.load(buffer);
          const pages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
          pages.forEach(p => mergedPdf.addPage(p));
        }
        const bytes = await mergedPdf.save();
        downloadBlob(bytes, '結合済み.pdf');
        mergeMsg.textContent = '結合が完了しました！';
      } catch (e) {
        mergeMsg.textContent = 'エラー: ' + e.message;
      }
    });

    // --- 2. 分割機能 ---
    const splitInput = document.getElementById('splitFile');
    const splitBtn = document.getElementById('splitBtn');
    const splitMsg = document.getElementById('splitMsg');

    splitInput.addEventListener('change', () => {
      splitBtn.disabled = splitInput.files.length === 0;
      splitMsg.textContent = '';
    });

    splitBtn.addEventListener('click', async () => {
      splitMsg.textContent = '分割中...';
      try {
        const file = splitInput.files[0];
        const buffer = await file.arrayBuffer();
        const srcPdf = await PDFLib.PDFDocument.load(buffer);
        const count = srcPdf.getPageCount();

        for (let i = 0; i < count; i++) {
          const newPdf = await PDFLib.PDFDocument.create();
          const [page] = await newPdf.copyPages(srcPdf, [i]);
          newPdf.addPage(page);
          const bytes = await newPdf.save();
          downloadBlob(bytes, `page_${i + 1}.pdf`);
          // ブラウザの同時ダウンロード詰まり防止のためわずかに待機
          await new Promise(r => setTimeout(r, 150));
        }
        splitMsg.textContent = `${count} ページの分割保存が完了しました！`;
      } catch (e) {
        splitMsg.textContent = 'エラー: ' + e.message;
      }
    });

    // --- 3. 回転機能 ---
    const rotateInput = document.getElementById('rotateFile');
    const rotateBtn = document.getElementById('rotateBtn');
    const rotateMsg = document.getElementById('rotateMsg');

    rotateInput.addEventListener('change', () => {
      rotateBtn.disabled = rotateInput.files.length === 0;
      rotateMsg.textContent = '';
    });

    rotateBtn.addEventListener('click', async () => {
      rotateMsg.textContent = '回転処理中...';
      try {
        const file = rotateInput.files[0];
        const buffer = await file.arrayBuffer();
        const pdf = await PDFLib.PDFDocument.load(buffer);
        const pages = pdf.getPages();
        pages.forEach(p => {
          const currentAngle = p.getRotation().angle;
          p.setRotation(PDFLib.degrees((currentAngle + 90) % 360));
        });
        const bytes = await pdf.save();
        downloadBlob(bytes, `回転済み_${file.name}`);
        rotateMsg.textContent = '右に90度回転しました！';
      } catch (e) {
        rotateMsg.textContent = 'エラー: ' + e.message;
      }
    });
  </script>
</body>
</html>
